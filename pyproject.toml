[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spine"
version = "0.1.0"
description = "Pre-trade controls and a provable audit trail for AI trading agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Vishnu Rajeev" }]
keywords = ["ai-agents", "trading", "pre-trade-risk", "audit-log", "policy", "prompt-injection", "governance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "SQLAlchemy>=2.0",
    "greenlet>=3.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "psycopg2-binary>=2.9",
    "bcrypt>=4.1",
    "email-validator>=2.1",
    # Observability (active only when OTEL_ENABLED=true)
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-exporter-otlp>=1.25.0",
    "prometheus-client>=0.20.0",
    "pyjwt[crypto]>=2.8.0",
    "cryptography>=42.0.0",
    # Plan reviewer: Celery worker + the model call
    "anthropic>=0.40.0",
    "celery[redis]>=5.4",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
    # Pinned exactly: ruff's formatter changes its output between releases, so
    # an unpinned version means CI can start failing with no change to the
    # code. Bump deliberately, and run `ruff format .` in the same commit.
    "ruff==0.16.1",
]

[project.urls]
Homepage = "https://github.com/VishnuR23/spine"
Repository = "https://github.com/VishnuR23/spine"
Issues = "https://github.com/VishnuR23/spine/issues"

[tool.setuptools.packages.find]
include = ["spine*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Importing a pytest fixture by name into a test module is how fixtures are
# shared across files. Ruff reads the fixture argument as a redefinition of
# the imported name; it isn't one.
"tests/*" = ["F811"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Put the repo root on sys.path so `import spine` works with a plain `pytest`,
# without needing an editable install. Without this, only `python -m pytest`
# works (that form adds the cwd itself) and bare `pytest` fails to collect.
pythonpath = ["."]
